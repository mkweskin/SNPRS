name: snprs_analysis

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:

  - python=3.9

  # Core
  - pandas
  - polars-lts-cpu
  - numpy
  - pyarrow
  - natsort
  - tqdm
  - psutil
  - joblib
  - scipy
  
  # Plotting / visualization
  - matplotlib
  - seaborn
  - plotnine
  - matplotlib-venn
  - upsetplot
  - plotly

  # Stats
  - pingouin
  - patsy
  - statsmodels

  # Jupyter / analysis
  - jupyterlab
  - ipykernel
  - ipywidgets
  - rpds-py

  # Bioinformatics / data
  - biom-format
  - h5py
  - biopython
  - pysam
  - bcftools
  - bedtools
  - pybedtools
  - krakentools
  - seqkit
  - scikit-bio
  - scikit-learn

  # Phylogenetics
  - dendropy
  - ete3
  - toytree
