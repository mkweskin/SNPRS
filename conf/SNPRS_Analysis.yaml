name: snprs_analysis

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  
  # Jupyter / analysis
  - jupyterlab
  - ipykernel
  - ipywidgets

  # Stats
  - pingouin
  - patsy

  # Plotting / visualization
  - plotnine
  - matplotlib-venn
  - upsetplot

  # Bio / HDF5
  - biom-format
  - h5py

  # Python + core utilities
  - python>=3.9
  - pandas
  - psutil
  - coreutils
  - scikit-learn
  - matplotlib
  - polars-lts-cpu
  - seqkit
  - scikit-bio
  - plotly
  - tqdm
  - joblib
  - scipy
  - seaborn
  - statsmodels
  - biopython
  - pyarrow
  - natsort

  # Bioinformatics Tools
  - bedtools
  - pybedtools
  - krakentools
  - pysam
  - bcftools

  # Phylogenetic Tools
  - dendropy
  - ete3
  - toytree





