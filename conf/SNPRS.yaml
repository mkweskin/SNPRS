name: snprs_env

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  
  # Python + core utilities
  - python>=3.9
  - pandas
  - psutil
  - coreutils
  - scikit-learn
  - matplotlib
  - polars-lts-cpu
  - seqkit
  - scikit-bio
  - plotly
  - tqdm
  - joblib
  - scipy
  - seaborn
  - statsmodels
  - biopython
  - pyarrow
  - natsort

  # Bioinformatics Tools
  - bedtools
  - pybedtools
  - bowtie2
  - samtools=1.19.2
  - kraken2
  - augustus
  - bbmap
  - sra-tools
  - krakentools
  - bracken
  - pysam
  - bcftools

  # Phylogenetic Tools
  - veryfasttree 
  - iqtree
  - dendropy
  - ete3
  - toytree
  - rapidnj






