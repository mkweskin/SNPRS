name: snprs_env

channels:
  - conda-forge
  - bioconda
  - defaults

channel_priority: strict

dependencies:
  - python=3.8.1
  - bedtools
  - pybedtools
  - bowtie2
  - samtools
  - bbmap
  - pandas
  - biopython
  - scikit-learn
  - matplotlib
  - polars>=0.20.9
  - polars-u64-idx
  - pysam
  - pyarrow
  - bcftools
  - fasttree
  - iqtree=2.3.6
  - seqkit
