name: snprs_env

channels:
  - bioconda
  - conda-forge
  - defaults

dependencies:
  - python=3.8.1
  - bedtools
  - mash
  - bowtie2
  - samtools=1.3.1
  - zlib
  - openmpi=3.1.4
  - ray
  - bbmap
  - pip
  - pip:
    - pybedtools
    - scikit-learn
    - scipy 
    - pandas
    - Bio
    - datetime
