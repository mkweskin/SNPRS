name: snprs_env

channels:
  - conda-forge
  - bioconda
  - defaults

channel_priority: strict

dependencies:
  - python=3.8.1
  - psutil
  - coreutils
  - bedtools
  - pybedtools
  - bowtie2
  - samtools
  - bbmap
  - pandas
  - biopython
  - scikit-learn
  - matplotlib
  - polars-lts-cpu>=0.20.9
  - pysam
  - pyarrow
  - bcftools
  - veryfasttree=3.2.1 
  - iqtree=2.3.6
  - seqkit
  - natsort
  - dendropy
  - ete3
  - toytree
  - scikit-bio
  - plotly
  - sra-tools